<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 ESSE - Fatturazione</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-gray-800 relative">

    <aside class="w-64 bg-white border-r border-gray-200 hidden md:flex flex-col">
        <!-- Uguale al precedente -->
    </aside>

    <main id="vista-elenco" class="flex-1 flex flex-col h-screen overflow-hidden">
        <!-- Header uguale al precedente -->
    </main>

    <div id="vista-scheda" class="hidden absolute inset-0 bg-[#f8fafc] z-40 overflow-y-auto flex-col">
        <!-- Header Uguale -->

        <div class="p-8 max-w-7xl mx-auto w-full space-y-6">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Box Storico Documenti -->

                <div class="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
                    <h3 class="text-base font-bold text-gray-800 mb-2">Note Amministrative</h3>
                    
                    <div class="flex flex-col sm:flex-row items-center gap-3 mb-6 bg-gray-50 p-3 rounded-xl border border-gray-200">
                        <input type="date" id="data-nota-libera" class="w-full sm:w-36 px-3 py-2 border border-gray-300 rounded-lg text-sm font-bold text-gray-600 focus:outline-none focus:ring-2 focus:ring-[#2e2a5b]">
                        <input type="text" id="input-nota-libera" placeholder="Aggiungi una nota su questo incasso..." class="flex-1 w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#2e2a5b]">
                        <button onclick="salvaNotaLibera()" class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-lg text-sm font-bold shadow-sm whitespace-nowrap">Aggiungi Nota</button>
                    </div>

                    <div id="lista-cronologia" class="space-y-4 max-h-80 overflow-y-auto no-scrollbar"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODALE SEGRETO: MODIFICA LOG DIARIO -->
    <div id="modal-modifica-log" class="hidden fixed inset-0 bg-slate-900/60 z-[80] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg flex flex-col overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <div>
                    <h3 class="text-lg font-bold text-gray-900">Modifica Record Diario</h3>
                    <p class="text-xs text-gray-500">Modalità Amministratore</p>
                </div>
                <button type="button" onclick="chiudiModaleModificaLog()" class="text-gray-400 hover:text-gray-700 text-2xl leading-none">&times;</button>
            </div>
            <div class="p-6 space-y-4">
                <input type="hidden" id="mod-log-id">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Azione Registrata (Titolo)</label>
                    <input type="text" id="mod-log-azione" class="w-full px-4 py-2 bg-white border border-gray-200 rounded-lg text-sm font-bold text-gray-900 outline-none focus:ring-2 focus:ring-[#2e2a5b]">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nota Libera / Appunto</label>
                    <textarea id="mod-log-nota" rows="3" class="w-full px-4 py-2 bg-white border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-[#2e2a5b]"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Data Registrazione (Retroattiva)</label>
                    <input type="datetime-local" id="mod-log-data" class="w-full px-4 py-2 bg-white border border-gray-200 rounded-lg text-sm font-bold text-[#2e2a5b] outline-none focus:ring-2 focus:ring-[#2e2a5b]">
                </div>
            </div>
            <div class="p-5 border-t border-gray-100 flex justify-between gap-3 bg-gray-50">
                <button type="button" onclick="eliminaLog()" class="text-sm font-bold text-red-600 hover:text-red-800 flex items-center gap-1">🗑️ Elimina Record</button>
                <div class="flex gap-2">
                    <button type="button" onclick="chiudiModaleModificaLog()" class="px-4 py-2 rounded-lg text-sm font-semibold text-gray-600 bg-white border border-gray-200 hover:bg-gray-100">Annulla</button>
                    <button type="button" onclick="salvaModificaLog()" class="bg-[#2e2a5b] hover:bg-[#3f3a7a] text-white px-5 py-2 rounded-lg text-sm font-bold shadow-sm">Salva Modifiche</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ALTRI MODALI OMITTITI PER BREVITÀ, RIMANGONO IDENTICI AL FILE ORIGINALE... -->
    <!-- PER INSERIRE NEI FILE IL CODICE COPIA DA QUI IN GIÙ LE FUNZIONI JS AGGIORNATE -->

    <script src="config.js"></script>

    <script>
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const UTENTE_CORRENTE = document.getElementById('nome-utente-sidebar').innerText;

        let fattureCorrenti = [];
        let fatturaAttivaIndex = null;
        let apertoDaCommessa = false; 
        let filtroFattureCorrente = 'Tutte';

        let clientiGlobali = [];
        let commesseGlobali = [];
        let pagamentiGlobali = [];
        
        let logsCorrenti = []; // Aggiunto

        const sequenzaStati = ['Da Emettere', 'Emessa / Inviata', 'Pagata'];

        // ======================= FUNZIONI MODIFICA SEGRETA LOG =======================
        function apriModaleModificaLog(idStr) {
            const logId = parseInt(idStr);
            const log = logsCorrenti.find(l => l.id === logId);
            if(!log) return;
            document.getElementById('mod-log-id').value = log.id;
            document.getElementById('mod-log-azione').value = log.azione || '';
            document.getElementById('mod-log-nota').value = log.nota || '';
            
            if (log.created_at) {
                const d = new Date(log.created_at);
                d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
                document.getElementById('mod-log-data').value = d.toISOString().slice(0,16);
            }
            document.getElementById('modal-modifica-log').classList.remove('hidden');
        }

        function chiudiModaleModificaLog() {
            document.getElementById('modal-modifica-log').classList.add('hidden');
        }

        async function salvaModificaLog() {
            const id = document.getElementById('mod-log-id').value;
            const nuovaAzione = document.getElementById('mod-log-azione').value;
            const nuovaNota = document.getElementById('mod-log-nota').value;
            const nuovaData = document.getElementById('mod-log-data').value;

            let timestamp = new Date().toISOString();
            if (nuovaData) timestamp = new Date(nuovaData).toISOString();

            const { error } = await supabaseClient.from('commesse_log').update({
                azione: nuovaAzione,
                nota: nuovaNota || null,
                created_at: timestamp
            }).eq('id', id);

            if (!error) {
                chiudiModaleModificaLog();
                caricaCronologia();
            } else {
                alert("Errore modifica log: " + error.message);
            }
        }

        async function eliminaLog() {
            const id = document.getElementById('mod-log-id').value;
            if (!confirm("ATTENZIONE: Vuoi eliminare definitivamente questa registrazione dal diario?")) return;
            
            const { error } = await supabaseClient.from('commesse_log').delete().eq('id', id);
            if (!error) {
                chiudiModaleModificaLog();
                caricaCronologia();
            } else {
                alert("Impossibile eliminare: " + error.message);
            }
        }
        // =============================================================================

        // --- GESTIONE NOTA MANUALE E DIARIO GLOBALE ---
        async function salvaNotaLibera() {
            const inputNota = document.getElementById('input-nota-libera');
            const dataNota = document.getElementById('data-nota-libera').value;
            const testo = inputNota.value;
            if (!testo || testo.trim() === '') return;
            
            const comId = fattureCorrenti[fatturaAttivaIndex].commessa_id;
            
            let timestamp = new Date().toISOString();
            if (dataNota && dataNota !== new Date().toISOString().split('T')[0]) {
                timestamp = new Date(`${dataNota}T12:00:00Z`).toISOString();
            }

            const { error } = await supabaseClient.from('commesse_log').insert([{ 
                commessa_id: comId, 
                azione: "Nota Amministrativa", 
                nota: testo, 
                autore: UTENTE_CORRENTE,
                created_at: timestamp 
            }]);
            
            if (!error) { 
                inputNota.value = ''; 
                caricaCronologia(); 
            } 
        }

        async function caricaCronologia() {
            const comId = fattureCorrenti[fatturaAttivaIndex].commessa_id;
            const divLog = document.getElementById('lista-cronologia');
            divLog.innerHTML = '<p class="text-sm text-gray-500 italic">Caricamento...</p>';
            
            const { data: logs } = await supabaseClient.from('commesse_log').select('*')
                .eq('commessa_id', comId)
                .or('azione.ilike.%fattur%,azione.ilike.%incasso%,azione.ilike.%acconto%,azione.ilike.%pagament%,azione.ilike.%Nota Amm%')
                .order('created_at', { ascending: false });

            if (!logs || logs.length === 0) { divLog.innerHTML = '<p class="text-sm text-gray-500">Nessuna nota presente.</p>'; return; }

            logsCorrenti = logs; // SALVO I LOG IN MEMORIA
            let html = '';
            
            logs.forEach(log => {
                const dateObj = new Date(log.created_at);
                const dataFormat = dateObj.toLocaleDateString('it-IT') + ' ' + dateObj.toLocaleTimeString('it-IT', { hour: '2-digit', minute:'2-digit' });
                const notaHtml = log.nota ? `<p class="text-sm text-gray-700 mt-2 bg-gray-50 p-2 rounded-lg border border-gray-100 shadow-inner">"${log.nota}"</p>` : '';
                
                let icona = '<div class="w-2 h-2 rounded-full bg-[#2e2a5b] mt-1.5 ring-4 ring-indigo-50"></div>';
                if(log.azione.includes('Incasso') || log.azione.includes('💰')) icona = '<div class="w-4 h-4 rounded flex items-center justify-center bg-emerald-100 text-emerald-600 text-[10px] ring-2 ring-emerald-50">✅</div>';

                // WRAPPER SEGRETI DOPPIO CLIC
                let iconaContainer = `<div class="cursor-pointer hover:scale-125 transition-transform" ondblclick="apriModaleModificaLog('${log.id}')" title="Doppio clic per modificare">${icona}</div>`;
                let pData = `<p class="text-[9px] font-bold text-gray-400 uppercase tracking-wider cursor-pointer hover:text-[#2e2a5b] transition-colors" ondblclick="apriModaleModificaLog('${log.id}')" title="Doppio clic per modificare">${dataFormat}</p>`;

                html += `
                    <div class="flex gap-4 items-start pb-3 border-b border-gray-100 last:border-0">
                        ${iconaContainer}
                        <div class="flex-1">
                            <div class="flex justify-between items-center mb-1">
                                <p class="text-xs font-bold text-gray-900">${log.azione}</p>
                                ${pData}
                            </div>
                            ${notaHtml}
                        </div>
                    </div>
                `;
            });
            divLog.innerHTML = html;
        }
    </script>
</body>
</html>
