<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 ESSE - Gestionale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-gray-800 relative">

    <aside class="w-64 bg-white border-r border-gray-200 hidden md:flex flex-col">
        <div class="p-6 flex items-center gap-3">
            <div class="w-6 h-6 bg-[#2e2a5b] rounded flex items-center justify-center text-white font-bold text-xs">3S</div>
            <span class="font-bold text-lg">3 ESSE</span>
        </div>
        <nav class="flex-1 overflow-y-auto px-4 space-y-1 text-sm font-medium text-gray-600 no-scrollbar">
            <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-100 transition-colors">Dashboard</a>
            <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-[#2e2a5b] text-white shadow-md">Clienti</a>
        </nav>
        <div class="p-4 border-t border-gray-200 m-4 rounded-xl bg-gray-50">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-blue-100 text-blue-700 rounded-full flex items-center justify-center font-bold">S</div>
                <div>
                    <p class="font-bold text-sm">Sebastiano</p>
                    <p class="text-xs text-gray-500 uppercase">Owner</p>
                </div>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="p-8 pb-4">
            <h1 class="text-xl font-bold">Buongiorno, Sebastiano 👋</h1>
            <p class="text-sm text-gray-500 mt-1">Ecco la tua giornata</p>
        </header>

        <div class="flex-1 overflow-y-auto px-8 pb-8 no-scrollbar">
            <div class="mb-6 flex justify-between items-end">
                <div>
                    <h2 class="text-3xl font-bold tracking-tight">Clienti</h2>
                    <p class="text-sm text-gray-500 mt-1" id="conteggio-clienti">Caricamento in corso...</p>
                </div>
                <button onclick="apriModale()" class="bg-[#2e2a5b] hover:bg-[#3f3a7a] text-white px-5 py-2.5 rounded-lg text-sm font-semibold shadow-sm transition-colors flex items-center gap-2">
                    <span>+</span> Nuovo cliente
                </button>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="p-5 border-b border-gray-100 flex flex-col sm:flex-row gap-4">
                    <div class="flex-1 relative">
                        <input type="text" placeholder="Cerca nome..." class="w-full pl-10 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#2e2a5b] focus:bg-white transition-colors">
                        <span class="absolute left-3 top-2 text-gray-400">🔍</span>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-50/50 text-xs uppercase font-semibold text-gray-500 border-b border-gray-100">
                            <tr>
                                <th class="px-6 py-4">Nome</th>
                                <th class="px-6 py-4">Tipo</th>
                                <th class="px-6 py-4">Città</th>
                                <th class="px-6 py-4">Telefono</th>
                            </tr>
                        </thead>
                        <tbody id="tabella-clienti" class="divide-y divide-gray-100">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- FINESTRA MODALE NUOVO CLIENTE -->
    <div id="modal-cliente" class="hidden fixed inset-0 bg-slate-900/40 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[90vh] flex flex-col">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-white rounded-t-2xl">
                <div>
                    <h3 class="text-lg font-bold">Nuovo cliente</h3>
                    <p class="text-xs text-gray-500">Aggiungi un cliente all'anagrafica</p>
                </div>
                <button type="button" onclick="chiudiModale()" class="text-gray-400 hover:text-gray-700 text-2xl leading-none">&times;</button>
            </div>
            
            <div class="p-6 overflow-y-auto no-scrollbar">
                <form id="form-nuovo-cliente" class="space-y-5">
                    <!-- RIGA 1: Tipo e Stato -->
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Tipo</label>
                            <select id="form-tipo" class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#2e2a5b] outline-none">
                                <option value="Privato">Privato</option>
                                <option value="Azienda">Azienda</option>
                                <option value="Impresa">Impresa</option>
                                <option value="Condominio">Condominio</option>
                                <option value="Architetto">Architetto</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Stato</label>
                            <select id="form-stato" class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#2e2a5b] outline-none">
                                <option value="Attivo">Attivo</option>
                                <option value="Lead">Lead</option>
                                <option value="Storico">Storico</option>
                            </select>
                        </div>
                    </div>

                    <!-- RIGA 2: Nome / Ragione Sociale -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nome / Ragione sociale *</label>
                        <input type="text" id="form-nome" required class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#2e2a5b] outline-none transition-all">
                    </div>

                    <!-- RIGA 3: Indirizzo -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Indirizzo</label>
                        <input type="text" id="form-indirizzo" class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#2e2a5b] outline-none">
                    </div>

                    <!-- RIGA 4: Città, Prov, CAP -->
                    <div class="grid grid-cols-12 gap-4">
                        <div class="col-span-6">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Città</label>
                            <input type="text" id="form-citta" class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#2e2a5b] outline-none">
                        </div>
                        <div class="col-span-3">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Prov.</label>
                            <input type="text" id="form-prov" placeholder="es. TV" class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#2e2a5b] outline-none">
                        </div>
                        <div class="col-span-3">
                            <label class="block text-sm font-medium text-gray-700 mb-1">CAP</label>
                            <input type="text" id="form-cap" class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#2e2a5b] outline-none">
                        </div>
                    </div>

                    <!-- RIGA 5: Telefono e Email -->
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Telefono</label>
                            <input type="text" id="form-telefono" class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#2e2a5b] outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                            <input type="email" id="form-email" class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#2e2a5b] outline-none">
                        </div>
                    </div>

                    <!-- RIGA 6: Fonte -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Fonte</label>
                        <input type="text" id="form-fonte" placeholder="es. Passaparola, Sito web..." class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#2e2a5b] outline-none">
                    </div>

                    <!-- RIGA 7: Note -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Note</label>
                        <textarea id="form-note" rows="2" class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#2e2a5b] outline-none"></textarea>
                    </div>

                    <!-- RIGA 8: Toggle Dati Fiscali -->
                    <div class="pt-2">
                        <button type="button" id="btn-toggle-fiscali" class="text-sm font-semibold text-[#2e2a5b] flex items-center gap-1 hover:underline">
                            <span>+ Mostra Dati Fiscali</span>
                        </button>
                    </div>

                    <!-- RIGA 9: Campi Dati Fiscali (Nascosti di default) -->
                    <div id="sezione-dati-fiscali" class="hidden grid grid-cols-2 gap-4 pt-3 border-t border-gray-100">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Partita IVA</label>
                            <input type="text" id="form-piva" class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#2e2a5b] outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Codice fiscale</label>
                            <input type="text" id="form-cf" class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#2e2a5b] outline-none">
                        </div>
                    </div>
                </form>
            </div>
            
            <div class="p-6 border-t border-gray-100 flex justify-end gap-3 bg-gray-50 rounded-b-2xl">
                <button type="button" onclick="chiudiModale()" class="px-5 py-2.5 rounded-lg text-sm font-semibold text-gray-700 hover:bg-gray-200 transition-colors">Annulla</button>
                <button type="submit" form="form-nuovo-cliente" class="bg-[#2e2a5b] hover:bg-[#3f3a7a] text-white px-5 py-2.5 rounded-lg text-sm font-semibold shadow-sm transition-colors">Crea cliente</button>
            </div>
        </div>
    </div>

    <!-- RICHIAMA IL FILE DI CONFIGURAZIONE ESTERNO -->
    <script src="config.js"></script>

    <!-- SCRIPT PRINCIPALE -->
    <script>
        // Inizializza Supabase utilizzando le variabili importate da config.js
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function caricaClienti() {
            const { data: clienti, error } = await supabaseClient
                .from('clienti')
                .select('*')
                .order('created_at', { ascending: false });

            const tbody = document.getElementById('tabella-clienti');
            const conteggio = document.getElementById('conteggio-clienti');

            if (error) {
                console.error('Errore:', error);
                tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-4 text-center text-red-500">Errore di connessione.</td></tr>';
                return;
            }

            conteggio.innerText = `${clienti.length} clienti in anagrafica`;
            tbody.innerHTML = ''; 

            if (clienti.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">Nessun cliente trovato.</td></tr>';
                return;
            }

            clienti.forEach(cliente => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50 transition-colors cursor-pointer';
                
                const citta = cliente.citta || '--';
                const telefono = cliente.telefono || '--';
                const tipo = cliente.tipo || 'Privato';

                tr.innerHTML = `
                    <td class="px-6 py-4 font-semibold text-gray-900">${cliente.nome_ragione_sociale}</td>
                    <td class="px-6 py-4"><span class="px-3 py-1 bg-gray-100 text-gray-600 rounded-full text-xs font-medium">${tipo}</span></td>
                    <td class="px-6 py-4 text-gray-600">${citta}</td>
                    <td class="px-6 py-4 text-gray-600">${telefono}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Gestione apertura e chiusura Modale
        function apriModale() {
            document.getElementById('modal-cliente').classList.remove('hidden');
        }

        function chiudiModale() {
            document.getElementById('modal-cliente').classList.add('hidden');
            document.getElementById('form-nuovo-cliente').reset();
            
            // Riporta la sezione dati fiscali allo stato nascosto di default
            const sezioneFiscali = document.getElementById('sezione-dati-fiscali');
            const btnFiscali = document.getElementById('btn-toggle-fiscali');
            sezioneFiscali.classList.add('hidden');
            btnFiscali.innerHTML = '<span>+ Mostra Dati Fiscali</span>';
        }

        // Toggle per la sezione Dati Fiscali
        document.getElementById('btn-toggle-fiscali').addEventListener('click', () => {
            const sezione = document.getElementById('sezione-dati-fiscali');
            const btn = document.getElementById('btn-toggle-fiscali');
            
            sezione.classList.toggle('hidden');
            
            if (sezione.classList.contains('hidden')) {
                btn.innerHTML = '<span>+ Mostra Dati Fiscali</span>';
            } else {
                btn.innerHTML = '<span>- Nascondi Dati Fiscali</span>';
            }
        });

        // Invio dei dati al database
        document.getElementById('form-nuovo-cliente').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nuovoCliente = {
                tipo: document.getElementById('form-tipo').value,
                stato: document.getElementById('form-stato').value,
                nome_ragione_sociale: document.getElementById('form-nome').value,
                indirizzo: document.getElementById('form-indirizzo').value,
                citta: document.getElementById('form-citta').value,
                provincia: document.getElementById('form-prov').value,
                cap: document.getElementById('form-cap').value,
                telefono: document.getElementById('form-telefono').value,
                email: document.getElementById('form-email').value,
                fonte: document.getElementById('form-fonte').value,
                note: document.getElementById('form-note').value,
                // Aggiunti i dati fiscali nel caricamento (salvano stringa vuota se non compilati)
                partita_iva: document.getElementById('form-piva').value,
                codice_fiscale: document.getElementById('form-cf').value
            };

            const { error } = await supabaseClient.from('clienti').insert([nuovoCliente]);

            if (error) {
                alert("Errore durante il salvataggio: " + error.message);
            } else {
                chiudiModale();
                caricaClienti();
            }
        });

        // Caricamento iniziale
        document.addEventListener('DOMContentLoaded', caricaClienti);
    </script>
</body>
</html>
