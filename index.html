<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vetra - Clienti</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Libreria Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-gray-800">

    <aside class="w-64 bg-white border-r border-gray-200 hidden md:flex flex-col">
        <div class="p-6 flex items-center gap-3">
            <div class="w-6 h-6 bg-[#2e2a5b] rounded flex items-center justify-center text-white font-bold text-xs">V</div>
            <span class="font-bold text-lg">Vetra</span>
        </div>

        <nav class="flex-1 overflow-y-auto px-4 space-y-1 text-sm font-medium text-gray-600 no-scrollbar">
            <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-100 transition-colors">Dashboard</a>
            <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-[#2e2a5b] text-white shadow-md">Clienti</a>
            <!-- Altre voci menu nascoste per brevità, aggiungile se vuoi -->
        </nav>

        <div class="p-4 border-t border-gray-200 m-4 rounded-xl bg-gray-50">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-blue-100 text-blue-700 rounded-full flex items-center justify-center font-bold">S</div>
                <div>
                    <p class="font-bold text-sm">Sebastiano</p>
                    <p class="text-xs text-gray-500 uppercase">Owner</p>
                </div>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="p-8 pb-4">
            <h1 class="text-xl font-bold">Buongiorno, Sebastiano 👋</h1>
            <p class="text-sm text-gray-500 mt-1">Ecco la tua giornata</p>
        </header>

        <div class="flex-1 overflow-y-auto px-8 pb-8 no-scrollbar">
            <div class="mb-6 flex justify-between items-end">
                <div>
                    <h2 class="text-3xl font-bold tracking-tight">Clienti</h2>
                    <p class="text-sm text-gray-500 mt-1" id="conteggio-clienti">Caricamento in corso...</p>
                </div>
                <button class="bg-[#2e2a5b] hover:bg-[#3f3a7a] text-white px-5 py-2.5 rounded-lg text-sm font-semibold shadow-sm transition-colors flex items-center gap-2">
                    <span>+</span> Nuovo cliente
                </button>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="p-5 border-b border-gray-100 flex flex-col sm:flex-row gap-4">
                    <div class="flex-1 relative">
                        <input type="text" placeholder="Cerca nome..." class="w-full pl-10 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#2e2a5b] focus:bg-white transition-colors">
                        <span class="absolute left-3 top-2 text-gray-400">🔍</span>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-50/50 text-xs uppercase font-semibold text-gray-500 border-b border-gray-100">
                            <tr>
                                <th class="px-6 py-4">Nome</th>
                                <th class="px-6 py-4">Tipo</th>
                                <th class="px-6 py-4">Città</th>
                                <th class="px-6 py-4">Telefono</th>
                            </tr>
                        </thead>
                        <!-- QUI VERRANNO INIETTATI I DATI -->
                        <tbody id="tabella-clienti" class="divide-y divide-gray-100">
                            <tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">Connessione al database in corso...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- SCRIPT COLLEGAMENTO SUPABASE -->
    <script>
        // 1. INSERISCI QUI I TUOI DATI DA SUPABASE
        const SUPABASE_URL = 'https://kzuefjscxqpxqafymfdo.supabase.co';
        
        // INCOLLA QUI LA TUA CHIAVE (tra le virgolette singole)
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6dWVmanNjeHFweHFhZnltZmRvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NDEwNTksImV4cCI6MjEwMzQxNzA1OX0.OWyjENw8EzzYNmHPfTZ5qghCvOaQ03zgOpo-Wyt0t8Q';

        // Inizializza Supabase (ho cambiato il nome in supabaseClient per non far confusione!)
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Funzione per scaricare i dati
        async function caricaClienti() {
            const { data: clienti, error } = await supabaseClient
                .from('clienti')
                .select('*')
                .order('created_at', { ascending: false });

            const tbody = document.getElementById('tabella-clienti');
            const conteggio = document.getElementById('conteggio-clienti');

            if (error) {
                console.error('Errore:', error);
                tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-4 text-center text-red-500">Errore di connessione. Apri la console per i dettagli.</td></tr>';
                return;
            }

            conteggio.innerText = `${clienti.length} clienti in anagrafica`;
            tbody.innerHTML = ''; // Svuota la tabella

            if (clienti.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">Nessun cliente trovato. Inseriscine uno su Supabase.</td></tr>';
                return;
            }

            // Crea le righe HTML per ogni cliente
            clienti.forEach(cliente => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50 transition-colors cursor-pointer';
                
                const citta = cliente.citta || '--';
                const telefono = cliente.telefono || '--';
                const tipo = cliente.tipo || 'Privato';

                tr.innerHTML = `
                    <td class="px-6 py-4 font-semibold text-gray-900">${cliente.nome_ragione_sociale}</td>
                    <td class="px-6 py-4"><span class="px-3 py-1 bg-gray-100 text-gray-600 rounded-full text-xs font-medium">${tipo}</span></td>
                    <td class="px-6 py-4 text-gray-600">${citta}</td>
                    <td class="px-6 py-4 text-gray-600">${telefono}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Lancia la funzione appena si apre la pagina
        document.addEventListener('DOMContentLoaded', caricaClienti);
    </script>
</body>
</html>
