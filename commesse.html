<form id="form-nuova-fattura" class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="col-span-2">
                            <label class="block text-xs font-bold text-gray-700 mb-1">Tipo Documento *</label>
                            <select id="fat-tipo" required class="w-full px-3 py-2 bg-white border border-gray-200 rounded-lg text-sm outline-none">
                                <option value="Fattura di Acconto">Fattura di Acconto</option>
                                <option value="Fattura di Saldo">Fattura di Saldo</option>
                                <option value="Fattura Unica">Fattura Unica</option>
                                <option value="Ricevuta / Pagamento">Ricevuta / Pagamento</option>
                            </select>
                        </div>
                        <div><label class="block text-xs font-bold text-gray-700 mb-1">Numero / Riferimento *</label><input type="text" id="fat-numero" required class="w-full px-3 py-2 bg-white border border-gray-200 rounded-lg text-sm font-bold text-[#2e2a5b] outline-none"></div>
                        <div><label class="block text-xs font-bold text-gray-700 mb-1">Importo (€) *</label><input type="number" step="0.01" id="fat-importo" required class="w-full px-3 py-2 bg-white border border-gray-200 rounded-lg text-sm outline-none"></div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Stato *</label>
                        <select id="fat-stato" required class="w-full px-3 py-2 bg-white border border-gray-200 rounded-lg text-sm outline-none">
                            <option value="Da Emettere">Da Emettere / Richiesta</option>
                            <option value="Emessa / Inviata">Emessa / Inviata al cliente</option>
                            <option value="Pagata">Pagata / Incassata</option>
                        </select>
                    </div>
                </form>
