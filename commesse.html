<!-- MODALE POSA AGGIORNATO: SUPERVISORE SEMPRE OBBLIGATORIO -->
    <div id="modal-intervento-posa" class="hidden fixed inset-0 bg-slate-900/60 z-[60] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg max-h-[90vh] flex flex-col">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-white rounded-t-2xl shrink-0">
                <div><h3 class="text-lg font-bold" id="modal-posa-titolo">Registra Intervento</h3></div>
                <button type="button" onclick="chiudiModalePosa()" class="text-gray-400 text-2xl leading-none">&times;</button>
            </div>
            <div class="p-6 overflow-y-auto no-scrollbar">
                <form id="form-intervento-posa" class="space-y-4">
                    <input type="hidden" id="posa-id">
                    
                    <!-- MENU A TENDINA CATEGORIA INTERVENTO -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Tipo Intervento *</label>
                        <select id="posa-tipo" onchange="gestisciCampiModalePosa()" class="w-full px-4 py-2 bg-white border border-gray-200 rounded-lg outline-none font-bold text-[#2e2a5b]">
                            <option value="Posa Completata">Posa Completata</option>
                            <option value="Posa Parziale">Posa Parziale</option>
                            <option value="Sistemazioni da Fare">Sistemazioni da Fare</option>
                            <option value="Rapporto Non Conformita">Rapporto Non Conformità</option>
                        </select>
                    </div>

                    <!-- BLOCCO SUPERVISORE (SEMPRE VISIBILE E OBBLIGATORIO) -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Supervisore / Responsabile (Rilevatore o Supervisore Cantiere) *</label>
                        <input type="text" id="posa-supervisore" required class="w-full px-4 py-2 bg-white border border-gray-200 rounded-lg outline-none">
                    </div>

                    <!-- BLOCCO RISOLUZIONE (SOLO PER SISTEMAZIONI / NON CONFORMITA) -->
                    <div id="box-risoluzione-posa" class="hidden bg-gray-50 border border-gray-200 p-3 rounded-lg space-y-3">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" id="posa-risolto" onchange="toggleBoxRisolto()" class="w-5 h-5 text-emerald-600 border-gray-300 rounded cursor-pointer">
                            <label for="posa-risolto" class="block text-sm font-bold text-gray-800 cursor-pointer">Segna come Sistemazione Risolta / Completata</label>
                        </div>
                        <div id="subbox-risoluzione" class="hidden space-y-3 pt-2 border-t border-gray-200">
                            <div>
                                <label class="block text-xs font-medium text-gray-600 mb-1">Data Risoluzione *</label>
                                <input type="date" id="posa-data-risoluzione" class="w-full px-3 py-1.5 bg-white border border-gray-200 rounded-lg text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-gray-600 mb-1">Squadra che ha eseguito la sistemazione *</label>
                                <input type="text" id="posa-squadra-risoluzione" class="w-full px-3 py-1.5 bg-white border border-gray-200 rounded-lg text-sm" placeholder="Nome posatore / squadra">
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-sm font-medium text-gray-700 mb-1">Data Intervento *</label><input type="date" id="posa-data" required class="w-full px-4 py-2 bg-white border border-gray-200 rounded-lg outline-none"></div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1" id="label-squadra">Squadra / Posatore *</label>
                            <input type="text" id="posa-squadra" required class="w-full px-4 py-2 bg-white border border-gray-200 rounded-lg outline-none">
                        </div>
                    </div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">Lavori eseguiti / Note *</label><textarea id="posa-note" rows="3" required class="w-full px-4 py-2 bg-white border border-gray-200 rounded-lg outline-none text-sm"></textarea></div>
                </form>
            </div>
            <div class="p-6 border-t border-gray-100 flex justify-end gap-3 bg-gray-50 rounded-b-2xl shrink-0"><button type="button" onclick="chiudiModalePosa()" class="px-5 py-2.5 rounded-lg text-sm font-semibold text-gray-700">Annulla</button><button type="submit" form="form-intervento-posa" id="btn-salva-posa" class="bg-[#2e2a5b] text-white px-5 py-2.5 rounded-lg text-sm font-semibold">Salva Intervento</button></div>
        </div>
    </div>
